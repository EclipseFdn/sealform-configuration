name: dt.basyx
repositories:
  - https://github.com/eclipse-basyx/basyx-studio.git
trusted_build_systems:
  - GitHub.com
artifact_configurations:
  exe-in-zip:
    file: artifact-configurations/all-exe-in-zip.xml
default_artifact_configuration: exe-in-zip
ci_users:
  dt.basyx-bot:
    signing_policies:
      - release-signing
      - test-signing
signing_policies:
  release-signing:
    extends: signing-policies/trusted-release.yaml
  test-signing:
    extends: signing-policies/trusted-test.yaml
